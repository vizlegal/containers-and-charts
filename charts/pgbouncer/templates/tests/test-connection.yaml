apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pgbouncer.fullname" . }}-test-connection"
  labels:
    {{- include "pgbouncer.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    # A TCP connect is the most we can assert without credentials. The previous
    # scaffold ran `wget` against port 5432, which speaks the Postgres wire
    # protocol -- that test could only ever fail.
    - name: tcp-connect
      image: {{ .Values.tests.image }}
      command: ["nc"]
      args: ["-z", "-w", "5", "{{ include "pgbouncer.fullname" . }}", "{{ .Values.service.port }}"]
  restartPolicy: Never
